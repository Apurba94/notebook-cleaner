[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-cleaner"
version = "0.1.0"
description = "Strip outputs, execution counts and noisy metadata from Jupyter notebooks before commit."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
notebook-cleaner = "notebook_cleaner.cli:main"

[tool.setuptools]
packages = ["notebook_cleaner"]
